name: Validate and deploy CP3 DAGs

on:
  pull_request:
    branches: [main]
    paths:
      - "dags/submissions/**"
      - "scripts/validate_dags.py"
      - ".github/workflows/deploy-dags.yml"
  push:
    branches: [main]
    paths:
      - "dags/submissions/**"
      - "scripts/validate_dags.py"
      - ".github/workflows/deploy-dags.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cp3-dag-deployment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate DAG submissions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate DAG files
        run: python3 scripts/validate_dags.py dags/submissions

  deploy:
    name: Upload approved DAGs to GCS
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/187742136599/locations/global/workloadIdentityPools/cp3-github/providers/github
          service_account: cp3-github-deployer@jcdeah-009.iam.gserviceaccount.com

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Upload approved DAGs
        run: >-
          gcloud storage rsync dags/submissions
          gs://jcdeah-009-cp3-airflow-dags/submissions
          --recursive
          --delete-unmatched-destination-objects
